<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b3b">
  <meta name="description" content="A responsive ward operations prototype for daily temperature checks, doctor rounds, discharge coordination, and outcome tracking.">
  <title>WardFlow | Facility operations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="WardFlow overview">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span><strong>WardFlow</strong><small>Facility operations</small></span>
      </a>
      <div class="facility-switcher"><span class="facility-dot"></span><span><b>North Wing</b><small>Quarantine facility</small></span><span class="chevron">⌄</span></div>
      <p class="nav-label">WORKSPACE</p>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="patients"><span class="nav-icon">▤</span>Patients<span class="nav-count" id="patientNavCount">74</span></button>
        <button class="nav-item" data-view="discharges"><span class="nav-icon">↗</span>Discharge queue<span class="nav-count amber" id="dischargeNavCount">2</span></button>
        <button class="nav-item" data-view="outcomes"><span class="nav-icon">◒</span>Outcomes</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-icon">i</span><div><b>Prototype workspace</b><small>Demo data stays in this browser.</small></div></div>
        <button type="button" data-action="reset-demo" style="width:100%;text-align:left;padding:9px 7px;border:0;background:transparent;color:#b8d2cc;font-size:10px">↻ &nbsp;Reset demo data</button>
        <button class="profile-button" type="button"><span class="avatar">MD</span><span class="profile-copy"><b id="profileRole">Nurse</b><small>Ward team</small></span><span class="chevron">⌄</span></button>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation">☰</button>
        <div class="crumb"><span>North Wing</span><span class="crumb-slash">/</span><b id="pageCrumb">Overview</b></div>
        <div class="topbar-right">
          <span class="today-label" id="todayLabel"></span>
          <label class="role-picker"><span>View as</span><select id="roleSwitcher" aria-label="Choose role"><option>Nurse</option><option>Doctor</option><option>Admin</option></select></label>
          <span class="avatar top-avatar">MD</span>
        </div>
      </header>
      <main id="appContent" class="content" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
